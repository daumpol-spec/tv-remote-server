<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TV Remote Control</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --line: #232830;
    --text: #e8eaed;
    --muted: #7a8290;
    --accent: #3ddc97;
    --danger: #ff5470;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    overflow: hidden;
  }
  #connectScreen {
    height: 100%; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 32px; width: 340px;
  }
  .card h1 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.05em; }
  .field input {
    width: 100%; background: #0b0d10; border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: 6px; font-family: inherit; font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .btn {
    width: 100%; padding: 11px; border-radius: 6px; border: none;
    background: var(--accent); color: #04120c; font-weight: 700; font-size: 13px;
    letter-spacing: 0.04em; cursor: pointer; margin-top: 6px;
  }
  .btn:active { transform: translateY(1px); }
  #connectError { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
  #controlScreen { display: none; height: 100%; width: 100%; position: relative; }
  #screenCanvas {
    width: 100%; height: 100%; object-fit: contain;
    background: #000; display: block; touch-action: none;
  }
  #statusBar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; font-size: 10px; color: var(--muted);
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    pointer-events: none; opacity: 0; transition: opacity 0.2s;
  }
  #controlScreen:hover #statusBar { opacity: 1; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); display: inline-block; margin-right: 6px; }
  .dot.online { background: var(--accent); }

  #debugPanel {
    position: absolute; bottom: 0; left: 0; right: 0;
    max-height: 35%; overflow-y: auto;
    background: rgba(0,0,0,0.75); color: #3ddc97;
    font-size: 10px; padding: 6px 10px; line-height: 1.6;
    pointer-events: none; white-space: pre-wrap;
  }
</style>
</head>
<body>

  <div id="connectScreen">
    <div class="card">
      <h1>เชื่อมต่ออุปกรณ์</h1>
      <div class="field">
        <label>SERVER URL</label>
        <input id="serverUrl" value="wss://your-server.example.com" />
      </div>
      <div class="field">
        <label>DEVICE ID</label>
        <input id="deviceId" placeholder="เช่น device-livingroom-01" />
      </div>
      <div class="field">
        <label>ADMIN TOKEN</label>
        <input id="adminToken" type="password" placeholder="Bearer token" />
      </div>
      <button class="btn" onclick="connect()">เชื่อมต่อ</button>
      <div id="connectError"></div>
    </div>
  </div>

  <div id="controlScreen">
    <div id="statusBar">
      <span><span class="dot" id="statusDot"></span><span id="statusText">กำลังเชื่อมต่อ...</span></span>
      <span id="deviceLabel"></span>
    </div>
    <canvas id="screenCanvas"></canvas>
    <div id="debugPanel"></div>
  </div>

<script>
let ws = null;
let canvas, ctx;
let deviceWidth = 0, deviceHeight = 0;

function debugLog(msg) {
  const panel = document.getElementById('debugPanel');
  if (!panel) return;
  const time = new Date().toLocaleTimeString();
  panel.textContent = `[${time}] ${msg}\n` + panel.textContent;
  const lines = panel.textContent.split('\n');
  if (lines.length > 15) panel.textContent = lines.slice(0, 15).join('\n');
}

function connect() {
  const serverUrl = document.getElementById('serverUrl').value.trim();
  const deviceId = document.getElementById('deviceId').value.trim();
  const token = document.getElementById('adminToken').value.trim();
  const errorEl = document.getElementById('connectError');

  if (!serverUrl || !deviceId || !token) {
    errorEl.textContent = 'กรอกข้อมูลให้ครบก่อนเชื่อมต่อ';
    return;
  }

  const url = `${serverUrl}/ws/admin?deviceId=${encodeURIComponent(deviceId)}&token=${encodeURIComponent(token)}`;

  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    document.getElementById('connectScreen').style.display = 'none';
    document.getElementById('controlScreen').style.display = 'block';
    document.getElementById('deviceLabel').textContent = deviceId;
    setStatus(true, 'เชื่อมต่อแล้ว');
    initCanvas();
  };

  ws.onmessage = (event) => {
    if (typeof event.data === 'string') {
      handleJsonMessage(event.data);
    } else {
      renderFrame(event.data);
    }
  };

  ws.onerror = () => {
    errorEl.textContent = 'เชื่อมต่อไม่สำเร็จ ตรวจสอบ URL/Token';
  };

  ws.onclose = () => {
    setStatus(false, 'ขาดการเชื่อมต่อ');
  };
}

function setStatus(online, text) {
  document.getElementById('statusDot').className = 'dot' + (online ? ' online' : '');
  document.getElementById('statusText').textContent = text;
}

function handleJsonMessage(text) {
  try {
    const msg = JSON.parse(text);
    if (msg.type === 'device_status') {
      setStatus(msg.online, msg.online ? 'อุปกรณ์ออนไลน์' : 'อุปกรณ์ออฟไลน์');
    }
  } catch (e) {
    console.warn('bad json from server', text);
  }
}

function initCanvas() {
  canvas = document.getElementById('screenCanvas');
  ctx = canvas.getContext('2d');
  resizeCanvasToWindow();
  window.addEventListener('resize', resizeCanvasToWindow);
  canvas.addEventListener('pointerdown', onPointerDown);
}

function resizeCanvasToWindow() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function renderFrame(arrayBuffer) {
  const blob = new Blob([arrayBuffer], { type: 'image/jpeg' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const firstFrame = deviceWidth === 0;
    deviceWidth = img.width;
    deviceHeight = img.height;
    if (firstFrame) debugLog(`ได้รับภาพแรก: ${img.width}x${img.height}`);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
    const drawW = img.width * scale;
    const drawH = img.height * scale;
    const offsetX = (canvas.width - drawW) / 2;
    const offsetY = (canvas.height - drawH) / 2;
    ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
    canvas.dataset.offsetX = offsetX;
    canvas.dataset.offsetY = offsetY;
    canvas.dataset.drawW = drawW;
    canvas.dataset.drawH = drawH;
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

function screenToDeviceCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  const offsetX = parseFloat(canvas.dataset.offsetX || 0);
  const offsetY = parseFloat(canvas.dataset.offsetY || 0);
  const drawW = parseFloat(canvas.dataset.drawW || canvas.width);
  const drawH = parseFloat(canvas.dataset.drawH || canvas.height);

  const relX = (x - offsetX) / drawW;
  const relY = (y - offsetY) / drawH;

  if (relX < 0 || relX > 1 || relY < 0 || relY > 1) {
    debugLog(`คลิกนอกขอบเขตภาพ (แถบดำ) — ไม่ส่งคำสั่ง`);
    return null;
  }

  return {
    x: relX * deviceWidth,
    y: relY * deviceHeight
  };
}

let pointerDownPos = null;
let pointerDownTime = 0;

function onPointerDown(e) {
  pointerDownPos = { x: e.clientX, y: e.clientY };
  pointerDownTime = Date.now();
  canvas.addEventListener('pointerup', onPointerUp, { once: true });
}

function onPointerUp(e) {
  const duration = Date.now() - pointerDownTime;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance < 10) {
    const coords = screenToDeviceCoords(e.clientX, e.clientY);
    if (coords) sendCommand({ type: 'tap', x: coords.x, y: coords.y });
  } else {
    const start = screenToDeviceCoords(pointerDownPos.x, pointerDownPos.y);
    const end = screenToDeviceCoords(e.clientX, e.clientY);
    if (start && end) {
      sendCommand({ type: 'swipe', x1: start.x, y1: start.y, x2: end.x, y2: end.y, duration: Math.max(duration, 100) });
    }
  }
}

function sendCommand(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
    debugLog(`ส่งคำสั่งแล้ว: ${JSON.stringify(obj)}`);
  } else {
    debugLog(`ส่งไม่สำเร็จ — WebSocket ไม่ได้เปิดอยู่ (state=${ws ? ws.readyState : 'null'})`);
  }
}
</script>
</body>
</html>
